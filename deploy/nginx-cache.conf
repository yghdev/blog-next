# 博客 HTML 微缓存（C1，2026-11-08）
#
# 装到 /etc/nginx/conf.d/blog-cache.conf（http 上下文），配合
# /etc/nginx/sites-available/blog 的 `location /` 使用。
#
# ── 为什么需要 ────────────────────────────────────────────────
# Next 自托管动态页默认下发
#   cache-control: private, no-cache, no-store, max-age=0, must-revalidate
# 而 nginx 之前没有 proxy_cache —— 每个请求都进 Node 渲染。单机
# MemoryHigh=300M，爬虫高峰时没有任何缓冲。
#
# ── 四条安全边界（每一条都对应一种"缓存把站点弄坏"的方式）────
#   1. 登录态（blog_session cookie）一律 bypass。
#      站主改完内容刷新就能看到实时结果，不会被自己的缓存骗；
#      同时避免把"带登录态渲染出来的东西"写进公共缓存。
#   2. RSC 请求一律 bypass。
#      Next App Router 的客户端导航请求带 `?_rsc=…` 查询串与 `RSC: 1` 头，
#      要的是 RSC 载荷而不是 HTML。缓存键按 $request_uri 算，查询串天然
#      不命中下面的正则；再加一道 $http_rsc 判断兜底。
#   3. 只缓存 200，且**不**忽略 Set-Cookie。
#      nginx 默认不缓存带 Set-Cookie 的响应 —— 这是防止登录态泄漏进
#      公共缓存的安全网，不要为了"多缓存一点"把它关掉。
#   4. 后端 5xx / 超时时用 stale 顶住，而不是把错误页缓存下来。
#
# ── 失效策略 ─────────────────────────────────────────────────
# TTL 30 秒，不做主动 purge（nginx 1.24 没有 ngx_cache_purge 模块）。
# 发布后访客最多看到 30 秒旧内容；站主带 cookie 会 bypass，看到的是实时内容。
# 验收标准（调研报告 8.7）：发布后 60 秒内可见 —— 30s TTL 满足。

# ── 访问日志格式（C6，2026-11-08）─────────────────────────────
# 默认的 combined 格式没有缓存状态与耗时，等于"缓存上线了但看不见效果"。
# 这里补三个字段：
#   cache=  $upstream_cache_status  HIT / MISS / BYPASS / STALE / EXPIRED
#   rt=     $request_time           客户端感知的总耗时（秒）
#   urt=    $upstream_response_time 回源耗时（秒）；HIT 时是 "-"
# 用 `scripts/log-stats.sh` 汇总命中率与慢请求。
log_format blog_main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time';

# ── 限流（C6，2026-11-08）────────────────────────────────────
# 应用层已经有登录与埋点的限流（lib/rate-limit.ts），但 /api/search 没有 ——
# 它每次请求都要查一次 FTS + 打分，是唯一"无缓存 + 有计算"的公开接口。
# 这里在网关层兜一道，防止被脚本刷。
#   rate=20r/m：正常用户一分钟搜不了 20 次；burst=10 允许连打几个词。
limit_req_zone $binary_remote_addr zone=blog_search:10m rate=20r/m;

proxy_cache_path /var/cache/nginx/blog
                 levels=1:2
                 keys_zone=blog_html:10m
                 max_size=200m
                 inactive=10m
                 use_temp_path=off;

# 哪些路径允许进缓存。只列"内容页"：
# 接口（/api/*）、搜索（/search）、后台（/admin）一律不缓存。
# 注意 $request_uri 含查询串：/p/34?_rsc=xxx 不会命中，天然 bypass。
map $request_uri $blog_cacheable {
    default 0;
    "~^/$"             1;
    "~^/p/[0-9]+$"     1;
    "~^/archives$"     1;
    "~^/shuoshuo$"     1;
    "~^/friend-links$" 1;
    "~^/about$"        1;
    "~^/tags/[^/?]+$"  1;
}

# 最终判定：可缓存路径 + 无登录 cookie + 非 RSC 请求 才走缓存。
# 其余情况 proxy_cache_bypass / proxy_no_cache 都置 1，等于"不读也不写"。
map "$blog_cacheable:$cookie_blog_session:$http_rsc" $blog_cache_bypass {
    default 1;
    "1::"   0;
}
