server {
    server_name blog.yghsite.cn;

    # 访问日志（C6，2026-11-08）：格式定义在 /etc/nginx/conf.d/blog-cache.conf。
    # 单独一个文件，便于按站点统计缓存命中率与慢请求。
    access_log /var/log/nginx/blog.access.log blog_main;

    # 上传体积上限。
    #   图片 8MB / 视频 16MB（见 lib/upload.ts 的 MAX_UPLOAD_BYTES / MAX_VIDEO_BYTES）。
    #   ⚠ 这个值不是"越大越省事"：整个 body 会在进入应用之前被读进内存，
    #     设太大时一次上传就能把 Node 进程顶进 cgroup 节流（MemoryHigh=300M），
    #     同进程所有请求一起超时，前台首页也会挂 —— 2026-10-28 线上事故。
    #   20m 相对 16MB 留余量给 multipart 边界，峰值内存仍低于 MemoryHigh。
    #   ⚠ 改 lib/upload.ts 的上限时必须同步改这里与 next.config.ts。
    client_max_body_size 20m;

    # 静态图片直出，绕过 Next.js 省内存
    location /images/ {
        alias /var/www/blog-images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后台：不索引
    location /admin {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 搜索接口限流（C6，2026-11-08）。
    # 它是唯一"无缓存 + 有计算"的公开接口（每次查 FTS + 打分），
    # 应用层没有限流，所以在网关兜一道。zone 定义见 conf.d/blog-cache.conf。
    location = /api/search {
        limit_req zone=blog_search burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传接口单独给足超时（2026-10-28）。
    #
    # 为什么需要：上传走 location /，而那里的 proxy_read_timeout 是 60s ——
    # 那是为了普通页面设的。16MB 的视频在慢网上传几分钟很正常
    # （实测本机上行 1.1MB/s 时，15MB 用了 37 秒），一旦超过 60s，
    # nginx 就断开并返回 504，用户看到的正是「上传失败」。
    # 这不是应用变慢，是网关先放弃了。
    #
    # 这里把读超时放到 300s，并且关掉请求体缓冲的磁盘写入压力：
    # client_body_in_file_only 不设（默认走内存+临时文件），
    # 关键是 proxy_request_buffering on（默认）——
    # 保持 nginx 先把整个 body 收完再转发给 Node，
    # 这样 Node 不会在慢连接上长时间挂着一个请求。
    location = /api/admin/upload {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 限制单次请求体大小（与 client_max_body_size 同义，显式写一遍便于阅读）
        client_max_body_size 20m;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;

        # ── HTML 微缓存（C1，2026-11-08）──────────────────────────────
        # 规则、安全边界与失效策略见 /etc/nginx/conf.d/blog-cache.conf 的注释。
        # 一句话：内容页缓存 30 秒；登录态 / RSC 请求 / 非 200 一律不进缓存。
        proxy_cache blog_html;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $blog_cache_bypass;
        proxy_no_cache $blog_cache_bypass;
        # Next 显式下发 no-store；这里只覆盖 Cache-Control / Expires，
        # **不覆盖 Set-Cookie** —— 带 Set-Cookie 的响应仍然不会被缓存。
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # 便于验证与排障：MISS / HIT / BYPASS / STALE / EXPIRED
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # 证书由 certbot 沿用原有
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/blog.yghsite.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.yghsite.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = blog.yghsite.cn) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name blog.yghsite.cn;
    return 404;
}
