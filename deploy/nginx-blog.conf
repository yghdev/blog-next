server {
    server_name blog.yghsite.cn;

    # 上传体积上限。
    #   图片上限 8MB / 视频上限 40MB（见 lib/upload.ts 的 MAX_UPLOAD_BYTES / MAX_VIDEO_BYTES）。
    #   这里必须比两者都大 —— 否则会在 nginx 层直接 413，应用层连日志都不会有，
    #   用户只看到「上传失败」而完全不知道是网关挡的。
    #   48m 相对 40MB 留了 20% 余量给 multipart 边界与表单字段。
    #   ⚠ 改 lib/upload.ts 的上限时必须同步改这里，两个数字是一对。
    client_max_body_size 48m;

    # 静态图片直出，绕过 Next.js 省内存
    location /images/ {
        alias /var/www/blog-images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后台：不索引
    location /admin {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # 证书由 certbot 沿用原有
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/blog.yghsite.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.yghsite.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = blog.yghsite.cn) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name blog.yghsite.cn;
    return 404;
}
