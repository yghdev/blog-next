name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: 单元与集成测试
        run: npm test

      - name: FTS5 冒烟（方案 §5 风险 1：Linux 侧产物是否支持 trigram）
        run: |
          node -e "
          const D=require('better-sqlite3');
          const db=new D(':memory:');
          db.exec(\"CREATE VIRTUAL TABLE t USING fts5(x, tokenize='trigram')\");
          db.prepare('INSERT INTO t VALUES (?)').run('霍夫变换底层原理');
          const n=db.prepare('SELECT count(*) c FROM t WHERE t MATCH ?').get('\"霍夫变换\"').c;
          if (n !== 1) { console.error('FTS5 trigram 不可用'); process.exit(1); }
          console.log('FTS5 + trigram OK');
          "

      - name: 构建
        run: npm run build

      # 真实 Next 集成测试跑在 .next/standalone/server.js 上。
      # 注意：**不能**在 npm run build 之后直接跑 —— Next 对 serverExternalPackages
      # （本项目是 better-sqlite3）只产出 package.json 空壳 + 指向空壳的软链，
      # 实体会在 build:dist 里才补进产物。所以这里二选一：
      #   a) 先 build:dist 再跑测试；b) 让测试自己实体化。
      # 这里采用 b（tests/helpers/next-server.mjs 启动前调用共享的
      # scripts/materialize-native-deps.mjs），因为它同时让 test:next 在本地
      # 只跑 npm run build 后也能用；而 build:dist 复用同一个函数，不会漂移。
      - name: 安装 Playwright 浏览器（双页隔离测试用）
        run: npx playwright install --with-deps chromium

      # Chromium 的系统库由上一步 --with-deps 覆盖（libnspr4 / libnss3 / libasound2）。
      # 但中文字体**不在**其中，必须显式安装：
      #   `.ui-tab` 只设了 min-height: 44px，宽度由文字撑开。没有中文字体时
      #   "文章"两字回退到 DejaVu 测得 43.73px，触发 `width < 44` 的热区断言失败，
      #   而日志 Math.round 又显示成 44 —— 报错是"44×44 却小于 44"，与真实原因无关。
      # 这一步失败要高可读，所以在装字体前先打印判定结果。
      - name: 安装中文字体（后台 UI 断言依赖文字度量）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          echo "fc-list :lang=zh 条目数：$(fc-list :lang=zh | wc -l)"
          fc-match "sans-serif:lang=zh-cn"

      - name: 真实 Next HTTP 集成测试（隔离数据库）
        run: npm run test:next

      - name: 浏览器双页隔离基础测试
        run: npm run test:browser

      - name: 组件对照页走查（双主题 / 窄屏 / 对比度 / 热区）
        run: npm run test:ui

      - name: 暗色缺陷回归（PostList / MediaGrid / StoragePanel）
        run: npm run test:dark

      - name: 后台分组导航与概览页
        run: npm run test:admin

      - name: 内容列表页（筛选语义 / 计数联动 / 窄屏）
        run: npm run test:content

      - name: 评论管理页（空状态出口 / 脏 URL / 超长内容）
        run: npm run test:comments

      - name: 媒体库（分页 / 筛选口径 / 裂图分块 / 竖图比例）
        run: npm run test:media

      - name: 设置拆页 / 外链 / 操作日志
        run: npm run test:settings
